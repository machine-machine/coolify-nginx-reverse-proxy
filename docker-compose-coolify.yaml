version: '3.7'
services:
  nginx-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PROXY_HOST=${PROXY_HOST}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]  # or http://localhost:80
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
